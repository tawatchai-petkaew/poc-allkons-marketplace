ingress:
  tls: false
  enabled: true
  hostname: www.allkons.com
  pathType: Prefix
  path: /api-product
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: request-size-limit
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 1Gi
    
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

service:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000