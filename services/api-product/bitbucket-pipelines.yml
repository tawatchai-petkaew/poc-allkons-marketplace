pipelines:
  pull-requests:
    '**':
      - step:
          name: AI Code Review
          image: node:22
          script:
            - apt-get update && apt-get install -y jq
            - git fetch origin $BITBUCKET_PR_DESTINATION_BRANCH
            - DIFF=$(git diff origin/$BITBUCKET_PR_DESTINATION_BRANCH...HEAD -- ":(glob)**/*.ts" ":(glob)**/*.tsx" ":(exclude)node_modules" | head -c 50000)
            - |
              if [ -z "$DIFF" ]; then
                echo "No TypeScript/JavaScript changes to review"
                exit 0
              fi
            - |
              REVIEW=$(curl -s https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg diff "$DIFF" '{
                  "model": "zhipuai/glm-4",
                  "messages": [{
                    "role": "user",
                    "content": ("You are a senior backend engineer reviewing a NestJS/TypeORM PR. The API must handle 500+ concurrent users.\n\nReview for:\n1. Bugs & Logic Errors (null handling, race conditions, async/await)\n2. Security Issues (SQL injection, XSS, input validation, auth checks)\n3. Performance (N+1 queries, missing indexes, unbounded queries, caching)\n4. Best Practices (DataSource not Connection, error handling, class-validator)\n\n**IMPORTANT FORMAT:**\nFor each issue found, use this format:\n\n### ⚠️ [Category] Issue Title\n**File:** `filename.ts` **Line:** `XX`\n**Problem:** Brief description\n**Suggested Fix:**\n```typescript\n// corrected code here\n```\n\nIf code looks good, say: ✅ **No issues found** - Code follows best practices.\n\nDiff (with line numbers from +/- markers):\n" + $diff)
                  }]
                }')" | jq -r '.choices[0].message.content // "Review failed"')
            - echo "## AI Code Review"
            - echo "$REVIEW"
            - |
              curl -s -X POST \
                -H "Authorization: Bearer $BITBUCKET_BEARER_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pullrequests/$BITBUCKET_PR_ID/comments" \
                -d "$(jq -n --arg content "## 🤖 AI Code Review\n\n$REVIEW" '{content: {raw: $content}}')"
