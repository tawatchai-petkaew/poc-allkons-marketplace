# SIT (System Integration Testing) Environment Configuration
# Moderate resources for testing integrations

ingress:
  tls: false
  enabled: true
  hostname: www.allkons.com
  pathType: Prefix
  path: /api-customer
  annotations:
    konghq.com/strip-path: "true"

replicaCount: 1

resources:
  requests:
    cpu: 150m      # Moderate CPU for SIT
    memory: 192Mi  # Moderate memory for SIT
  limits:
    cpu: 750m      # Higher limit for load testing
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2  # Limited scaling for SIT
  targetCPUUtilizationPercentage: 75

service:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
